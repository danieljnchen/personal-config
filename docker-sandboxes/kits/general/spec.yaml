schemaVersion: "2"
kind: sandbox
name: dchen-general-kit
version: v0.0.1
displayName: DanielGeneralKit
security:
  privileged: false

setup:
  startup:
    - command: ["chmod", "+x", "/home/agent/setup_sbx.sh"]
    - command: ["bash", "/home/agent/setup_sbx.sh"]

sandbox:
  image: danieljnchen/dchen-general-sbx:v0.0.3
  entrypoint: ["bash", "-c", "cd /home/agent && exec bash"]

permissions:
  network:
    allow:
      - lafid.dev
